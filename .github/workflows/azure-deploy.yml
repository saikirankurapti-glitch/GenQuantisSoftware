name: Build and Deploy GenQuantis Portal to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.x"

jobs:
  build:
    name: Build and package application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Verify production output
        run: |
          test -s dist/index.html
          test -s server/server.cjs
          test -s package-lock.json

      - name: Prepare App Service package
        run: |
          mkdir -p deploy
          cp -R dist server package.json package-lock.json deploy/
          cd deploy
          npm ci --omit=dev
          test -d node_modules/express
          test -d node_modules/mongoose

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: genquantis-appservice-package
          path: deploy/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: genquantis-appservice-package
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .

      - name: Show deployed URL
        run: echo "Deployment submitted to Azure App Service."
